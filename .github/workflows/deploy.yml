name: Deploy Family VOCA to GitHub Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 및 이전 실행 대기
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 가져오기 (Checkout)
        uses: actions/checkout@v4

      - name: 2. Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 설치 (openpyxl)
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: 4. 엑셀 검증 및 PWA 빌드
        run: |
          python build_app.py

      - name: 5. GitHub Pages 환경 설정
        uses: actions/configure-pages@v5

      - name: 6. Pages 배포 아티팩트 업로드 (dist 폴더)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: 7. GitHub Pages 배포 실행
        id: deployment
        uses: actions/deploy-pages@v4
